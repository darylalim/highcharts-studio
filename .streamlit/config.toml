# Project-level Streamlit theme: "Studio Slate" — the bundled financial-dashboard
# template's chrome, kept, with a categorical scale designed for this app rather than
# borrowed. Hex lowercased to match the builder's convention.
#
# It is a SINGLE [theme] table, and that is the point: defining both [theme.light]
# and [theme.dark] is what unlocks the light/dark toggle in the app's settings menu,
# so a lone [theme] locks the app to one mode — here, dark. Every viewer therefore
# resolves to the dark shell, which is what lets the builder theme UNCONDITIONALLY:
# there is no theme read in streamlit_app.py and no `dark=` flag on any builder, because
# a branch that cannot vary (and a cache key that cannot vary with it) would be theatre.
# What that trades away is self-correction — the chart no longer FOLLOWS the shell, it
# assumes it — so re-adding a subtable here would put dark charts on a light shell with
# nothing at runtime objecting. tests/test_smoke.py::
# test_app_theme_is_a_single_mode_with_no_light_dark_toggle is the only thing standing
# between that edit and a silently wrong render.
#
# The Highcharts charts render in an iframe / server-side PNG, so NONE of these colors
# reach them — not even chartCategoricalColors, which Streamlit applies only to its own
# Vega/Plotly charts. The charts mirror this theme by hand in highcharts_builder:
# DEFAULT_COLORS == chartCategoricalColors below, _DARK_CHROME's bg/text/muted/grid ==
# backgroundColor/textColor/grayColor/borderColor, and _HEATMAP_GRADIENT's two endpoints
# are drawn from chartSequentialColors. That duplication is guarded mechanically by
# tests/test_smoke.py::test_theme_colors_stay_in_sync_with_config, so editing one side
# alone fails the suite rather than drifting quietly.
[theme]
base = "dark"
primaryColor = "#60a5fa"             # bright blue for dark mode (== chartCategoricalColors[0])
backgroundColor = "#0f172a"          # deep slate
# A REAL surface step, not a tint. The template shipped #1e293b here, which is 1.22:1
# against the page — below any legible card boundary, in an app that is mostly controls
# (14 selectboxes, pills, a multiselect, a file uploader, a dataframe, four metrics). This
# is 1.36:1, and the gain is the FILL STEP, not the outline: `borderColor` actually loses
# against this lighter surface (1.41:1 -> 1.27:1), so a container now reads by its own
# ground rather than by its edge. Stated because the opposite is the natural assumption,
# and because raising `borderColor` to compensate is not free — it is also
# _DARK_CHROME["grid"], so it would brighten every chart gridline. It is a
# genuine interpolation on the Tailwind slate line, not a guess, and it was chosen against
# the SEMANTIC text tokens below rather than against the page alone — every one of them
# still clears 4.5:1 ON this surface, which is the check a brighter step would fail.
secondaryBackgroundColor = "#243146"
codeBackgroundColor = "#1e293b"      # code wells stay the darker step: they carry no text tokens
textColor = "#f1f5f9"                # light text
linkColor = "#60a5fa"
borderColor = "#334155"
codeTextColor = "#cbd5e1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"                   # subtle rounding - professional, not playful
buttonRadius = "6px"

# Typography. No `font`/`codeFont`: Streamlit's own Source Sans and Source Code, which the
# app's server serves. The template's Inter and JetBrains Mono came from fonts.googleapis.com,
# so every viewer's browser contacted Google (plan #26). No URL may appear in this file, which
# `test_app_config_loads_nothing_from_another_host` enforces.
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors for financial indicators. These are TEXT tokens — st.metric deltas,
# :red[…]/:green[…] markdown, badges — and are deliberately NOT the categorical scale
# below, which paints marks. Different jobs, different constraints: a text token has to
# clear 4.5:1 on the page AND on secondaryBackgroundColor, which the mark palette's
# louder members do not. Left at the template's values, which pass both.
greenColor = "#34d399"  # positive/gains - bright green
redColor = "#f87171"    # negative/losses - bright red
yellowColor = "#fbbf24" # warnings/caution
orangeColor = "#fb923c" # alerts
blueColor = "#60a5fa"   # informational
violetColor = "#a78bfa" # accent/highlights
grayColor = "#94a3b8"   # neutral/secondary text (== _DARK_CHROME["muted"])

# Chart colors. Streamlit applies these to its OWN charts only; this app renders every
# chart with Highcharts, which mirrors this list as highcharts_builder.DEFAULT_COLORS.
#
# The ORDER is load-bearing there: index 0 is the brand primary (waterfall's closing
# total, bullet's bar, a dumbbell's after-state), 1 is the green a waterfall rise takes,
# and 3 is the red a fall and a boxplot outlier take. Reordering repaints those meanings.
#
# This scale is DESIGNED, not borrowed, and that is the whole change. The upstream
# template's was the Tailwind -400 step of eight hues: harmonious, and a chart palette
# only by accident. Every entry sat at L* 64-81, so HUE was the only channel carrying
# series identity — and when hue collapses, nothing was left. Measured (CIEDE2000, with
# dichromacy simulated by Machado-Oliveira-Fernandes 2009 at severity 1.0), four of its
# 28 pairs fell below dE 20 in NORMAL vision (blue/sky 11.7, red/pink 18.6,
# yellow/orange 18.9, blue/violet 19.3) and six below dE 12 under deuteranopia — where
# blue #60a5fa and violet #a78bfa came out **0.3 apart**, i.e. the same colour for the
# ~6% of men who are deuteranopic, at slots 0 and 2 where a three-series chart puts them.
# Eight slots, about five identities.
#
# What replaced it, and the rules it was searched under (they are the design):
#   * Slot 0 is UNCHANGED. It is the most-loaded value in the system — the single-series
#     default, the waterfall total, the bullet bar, the dumbbell's after-marker, every
#     Streamlit accent — so it stays the brand blue AND stays bright (7.02:1). Freeing it
#     buys ~1.1 dE of separation and costs a dimmer primary; that trade was declined.
#   * The rise (1) and the fall (3) are split by ~24 L* points, and that ONE pair carries a
#     higher floor than the rest: confusing a gain with a loss produces a WRONG READING,
#     not merely an ugly one. Under deuteranopia green and red both simulate to yellows, so
#     HUE cannot separate them and lightness is the only channel left — the pair goes from
#     dE00 **9.89 to 14.65**. (A first pass claimed 24.6 here. It was never computed, and
#     the honest figure is the smaller one: this pair is expensive, because the split runs
#     rise-bright and ONLY that way — a saturated red that clears 4.5:1 exists only between
#     L* 57 and 68 while a saturated green reaches 84, so a fall cannot be made the lighter
#     mark without ceasing to read as red.) The fall buys prominence with CHROMA instead.
#   * Sky is gone. #38bdf8 was simultaneously chartCategoricalColors[5] and
#     chartSequentialColors[5] — a categorical IDENTITY and a heatmap VALUE painted the
#     same hex. Cyan takes the slot and the sequential ramp gets its hue back.
#   * Every entry sits in a 2.18x prominence band (5.01-10.95:1). A wider spread buys
#     more separation but imposes an ordinal rank on data that has none.
#   * Every entry stays above YIQ 128000, so Highcharts' `contrast` keyword resolves the
#     in-mark labels on pie/treemap/heatmap/waterfall to BLACK on all eight. Verified by
#     reading the rendered DOM, not from the arithmetic — the two published accounts of
#     that threshold disagree.
#   * The scale is searched against the CHROME as well as against itself. This is where
#     the original incident lived and a first pass missed it: series 7 came out dE00 6.24
#     from `grayColor` — the axis-LABEL colour — under deuteranopia, which is the 1.00:1
#     grey collision reproduced in a channel an identity check cannot see. Palette-vs-
#     chrome is now 9.28 at worst, and _SUNBURST_ROOT_COLOR (which a sunburst draws
#     surrounded by palette-coloured children) 12.39.
# Result: worst pair 19.8 normal, 9.3 deuteranopia, 9.6 protanopia, 9.5 tritanopia, and
# nothing in the scale within dE00 9.28 of a chrome value under any of the three.
# The lilac at index 2 is deliberately the palest thing here: a SATURATED violet is
# exactly what collides with a locked mid-blue under protanopia, so its low chroma is the
# price of not re-committing the bug this palette exists to fix.
chartCategoricalColors = [
    "#60a5fa",
    "#9cd882",
    "#e5bbff",
    "#e25e58",
    "#fabc2b",
    "#45d9c8",
    "#cd5cc1",
    "#ec8c4a",
]

# Sequential colors for heatmaps (blue gradient). highcharts_builder draws
# _HEATMAP_GRADIENT's two endpoints from this scale.
chartSequentialColors = [
    "#0c4a6e",
    "#075985",
    "#0369a1",
    "#0284c7",
    "#0ea5e9",
    "#38bdf8",
    "#7dd3fc",
    "#bae6fd",
    "#e0f2fe",
    "#f0f9ff",
]

# Dataframe styling
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#243146"

# Sidebar
[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#243146"
codeBackgroundColor = "#1e293b"
textColor = "#f1f5f9"
borderColor = "#334155"
primaryColor = "#60a5fa"

[server]
# Auto-rerun on file save, so editing streamlit_app.py / the builder reloads
# without a manual rerun. Streamlit auto-uses the watchdog dev dependency for
# fast watching when it's installed, and falls back to polling otherwise — so we
# don't pin fileWatcherType (which would warn in installs without the dev group).
runOnSave = true
