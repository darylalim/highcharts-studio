[build-system]
# >=1.27 for PEP 639 support: the [project].license SPDX string + license-files
# below are only honored (and emitted into the wheel metadata) by hatchling 1.27+.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "highcharts-studio"
version = "0.20.4"
description = "Streamlit application for building data visualizations with Highcharts."
# SPDX expression (PEP 639). Covers this project's own code only; the Highcharts
# JS/export server and the highcharts-core wrapper are proprietary and
# separately licensed — see the NOTICE file's third-party notice and the README.
# LICENSE is kept as pristine MIT (notice lives in NOTICE) so GitHub's license
# detector classifies the repo as "MIT" rather than "Other".
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# The README header badges advertise these version floors — "Python 3.12+"
# mirrors requires-python, "Streamlit 1.59+" the streamlit floor below — so
# test_readme_badges_stay_in_sync_with_project pins each badge to them (a bump
# here that leaves a badge stale fails that test).
requires-python = ">=3.12"
dependencies = [
    "highcharts-core>=1.10.3",
    "pandas>=2.2.0",
    # Pinned to the Streamlit version this app is developed and CI-tested
    # against; it also relies on recent APIs (st.iframe, st.badge, st.pills,
    # st.multiselect, st.toggle, st.segmented_control (with `required`),
    # width/height="stretch", bordered st.metric KPI cards in an
    # st.container(horizontal=True) row, and the extended theming keys
    # .streamlit/config.toml now uses — chartCategoricalColors,
    # chartSequentialColors, baseRadius, headingFontSizes and [theme.sidebar]).
    # That last group REPLACED the [theme.light]/[theme.dark] split (1.51.0) when
    # the app locked to a single dark [theme], so the app-alone floor is no longer
    # worth deriving here: it is a newer theming surface, not an older one, and it
    # is nowhere near the binding constraint.
    #
    # The floor is 1.59.0 because the TEST HARNESS outranks the app here: 1.59.0
    # gave st.image a first-class AppTest node, and tests/test_smoke.py's Static
    # PNG test reads it as `app.image` (before 1.59.0 that attribute does not
    # exist and the test dies with AttributeError). The floor is stated once, for
    # the whole project, so it has to cover the strictest consumer — and a floor
    # that installs cleanly but cannot run the suite is not a floor. Confirmed by
    # `uv lock --resolution lowest-direct`, which picked 1.57.0 before this bump.
    "streamlit>=1.59.0",
]

[dependency-groups]
# These also power the local Claude Code hooks in .claude/hooks/ (ruff + ty on
# edit, pytest on stop), not just CI — see CLAUDE.md > Hooks.
dev = [
    "pytest>=8.0",
    "ruff==0.16.10",
    # Never below 0.0.61: on 0.0.49 `ty check` was OOM-killed (SIGKILL, ~5 min) on
    # streamlit_app.py's chart-type label chain. Its cost grew super-linearly in the
    # branch count, and the dumbbell type's branch — the 14th of 18 — crossed the
    # cliff, so the CI gate died with no diagnostics from b614f7c onward. Removing any
    # one branch fixed it; declaring the tuple's types did not. Fixed upstream in
    # 0.0.61, which checked the same tree in ~1s; 0.0.85 checks it in ~0.2s
    # (re-timed and suppression-checked on the 0.20.1 bump).
    #
    # RE-TIME THE GATE ON EVERY BUMP of this pin, upward as well as down: the
    # regression was a PERFORMANCE one, so nothing announces its return — a
    # reintroduced cliff emits no diagnostic, it simply stops finishing. Timing alone
    # is not enough either. Confirm the checker is still doing the work by deleting
    # one of the inline `# ty: ignore[...]` suppressions and watching the error come
    # back, which also proves that rule name still exists upstream: a renamed or
    # removed rule leaves a suppression that silences nothing and a gate that passes
    # for the wrong reason.
    "ty==0.0.85",
    "watchdog>=6.0.0",
]

# This project ships a Streamlit app, not an importable package, so tell
# Hatchling it's fine to build an empty wheel (otherwise `uv sync` fails
# trying to determine which files to ship). The wheel still carries the LICENSE
# and NOTICE plus the license metadata (see [project].license / license-files
# above) — it just ships no code modules.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff.lint]
# Balanced set, not "ALL" (which fights this app's deliberate design).
# E501 is ignored: the formatter owns line length. target-version auto-infers
# py312 from requires-python. `.claude/hooks/*.py` isn't excluded (dot-dirs
# aren't in Ruff's default excludes), so the hook scripts are linted too.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
# Defaults are correct (line length 88, double quotes) — and as of Ruff 0.16 the
# defaults also decide WHICH FILES the formatter walks. It now formats Python code
# blocks in Markdown (```python / py / py3 / pyi / pycon fences) by default, so
# `ruff format --check .` covers CLAUDE.md and docs/chart-types.md alongside the
# .py tree. Kept deliberately (no `extend-exclude = ["*.md"]`): it drift-proofs
# those two files' API examples for free, which nothing else did.
#
# It is the one gate the hooks do NOT mirror. `post_edit_py.py` fires on
# `is_python_target`, i.e. `p.suffix == ".py"`, so a malformed fence in a .md file
# surfaces in CI and not on save — run `uv run ruff format --check .` by hand after
# editing one. Table kept as an explicit anchor for any future formatter settings.

[tool.ty]
# Defaults are a good baseline: ty infers the py312 target from requires-python
# (like Ruff), and stray highcharts-core stub mismatches are suppressed inline
# (`# ty: ignore[rule]`), not downgraded here. `ty check` also type-checks the
# `.claude/hooks/` scripts (they're part of the project tree). Anchor for future
# ty settings.
